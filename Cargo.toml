[workspace]
members = ["crates/license-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
sha2 = "0.10.9"
hmac = "0.12.1"
base64 = "0.22.1"
hex = "0.4.3"
uuid = { version = "1.18", features = ["v4", "serde"] }
getrandom = "0.3"
zeroize = "1.8"
clap = { version = "4.5", features = ["derive"] }
toml = "0.9"
axum = "0.8"
tokio = { version = "1.47", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rustix = { version = "1.1", features = ["fs", "process", "system", "thread"] }
subtle = "2.6"
tempfile = "3.22"
tower = { version = "0.5", features = ["util", "limit"] }
http-body-util = "0.1"
rpassword = "7.4"

[profile.release]
panic = "unwind"
lto = "thin"
strip = "debuginfo"
