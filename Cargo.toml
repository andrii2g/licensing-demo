[workspace]
members = ["crates/license-core", "crates/license-host", "crates/license-store", "crates/license-server", "crates/license-admin", "crates/licensectl", "crates/license-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.22.1"
hex = "=0.4.3"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
getrandom = "=0.3.4"
zeroize = "=1.9.0"
clap = { version = "=4.6.7", features = ["derive"] }
toml = "=0.9.12"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["full"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rustix = { version = "=1.1.5", features = ["fs", "process", "system", "thread"] }
subtle = "=2.6.1"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util", "limit"] }
http-body-util = "=0.1.5"
rpassword = "=7.5.4"

[profile.release]
panic = "unwind"
lto = "thin"
strip = "debuginfo"
